---
- name: Reload Komodo Nginx
  ansible.builtin.command:
    cmd: docker exec komodo-nginx nginx -s reload
  changed_when: true

- name: Restart Komodo Certbot
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate certbot
    chdir: "{{ komodo_core_base_dir }}"
  changed_when: true

- name: Restart Komodo Core
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate --remove-orphans
    chdir: "{{ komodo_core_base_dir }}"
  changed_when: true
