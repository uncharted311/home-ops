---
- name: Komodo Core, Nginx und Certbot Verzeichnisse anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ komodo_core_base_dir }}"
    - "{{ komodo_core_base_dir }}/nginx"
    - "{{ komodo_core_base_dir }}/nginx/conf"
    - "{{ komodo_core_base_dir }}/certbot"
    - "{{ komodo_core_base_dir }}/certbot/certs"

- name: Komodo Core .env mit Secrets ausrollen
  ansible.builtin.template:
    src: env.j2
    dest: "{{ komodo_core_base_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Komodo Core

- name: Cloudflare DNS Credentials für Certbot ausrollen
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: "{{ komodo_core_base_dir }}/certbot/cloudflare.ini"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Komodo Core

- name: Certbot Entrypoint-Skript ausführbar ausrollen
  ansible.builtin.template:
    src: certbot-entrypoint.sh.j2
    dest: "{{ komodo_core_base_dir }}/certbot/certbot-entrypoint.sh"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Komodo Core

- name: Komodo Core docker-compose.yml ausrollen
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ komodo_core_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Komodo Core

- name: Nginx Reverse-Proxy-Konfiguration ausrollen
  ansible.builtin.template:
    src: komodo.conf.j2
    dest: "{{ komodo_core_base_dir }}/nginx/conf/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Komodo Nginx

- name: Komodo Core Stack starten und auf Zielversion halten
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ komodo_core_base_dir }}"
  register: komodo_core_compose_up
  changed_when: >-
    'Recreated' in komodo_core_compose_up.stderr or
    'Created' in komodo_core_compose_up.stderr or
    'Pulling' in komodo_core_compose_up.stderr
  when: not ansible_check_mode
