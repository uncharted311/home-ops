---
- name: Persistente Komodo- und Stack-Verzeichnisse anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ komodo_base_dir }}"
    - "/opt/docker"

- name: Optionale Stack-Verzeichnisse auf dem Host anlegen
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('1000') }}"
    group: "{{ item.group | default('1000') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ komodo_periphery_stack_directories | default([]) }}"

- name: Paket age auf Alpine installieren
  community.general.apk:
    name: age
    state: present

- name: Statisches SOPS-Binary installieren
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    dest: /usr/local/bin/sops
    owner: root
    group: root
    mode: "0755"

- name: Verzeichnis für host-spezifischen Age-Key anlegen
  ansible.builtin.file:
    path: /etc/sops/age
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Host-spezifischen Age-Key erzeugen (falls nicht vorhanden)
  ansible.builtin.command:
    cmd: age-keygen -o /etc/sops/age/keys.txt
    creates: /etc/sops/age/keys.txt

- name: Berechtigungen für Host-Age-Key sicherstellen
  ansible.builtin.file:
    path: /etc/sops/age/keys.txt
    owner: root
    group: root
    mode: "0600"

- name: Public Key des Hosts auslesen
  ansible.builtin.command:
    cmd: age-keygen -y /etc/sops/age/keys.txt
  register: komodo_periphery_age_public_key
  changed_when: false

- name: Host-Age-Public-Key für .sops.yaml anzeigen
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} -> {{ komodo_periphery_age_public_key.stdout }}"

- name: Docker Compose Datei für Komodo Periphery ausrollen
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ komodo_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Komodo Periphery

- name: Komodo Periphery Stack starten und aktuell halten
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ komodo_base_dir }}"
  register: komodo_periphery_compose_up
  changed_when: >-
    'Recreated' in komodo_periphery_compose_up.stderr or
    'Created' in komodo_periphery_compose_up.stderr or
    'Pulling' in komodo_periphery_compose_up.stderr
  when: not ansible_check_mode
