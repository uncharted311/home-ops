---
- name: Community-Repository auf Alpine aktivieren
  ansible.builtin.replace:
    path: /etc/apk/repositories
    regexp: '^#(.*community)$'
    replace: '\1'

- name: Docker und Docker Compose auf Alpine installieren
  community.general.apk:
    name:
      - docker
      - docker-cli-compose
    state: present
    update_cache: true

- name: Docker-Dienst in OpenRC aktivieren und starten
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started