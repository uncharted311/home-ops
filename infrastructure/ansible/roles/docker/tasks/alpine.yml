---
- name: Community-Repository auf Alpine aktivieren
  ansible.builtin.replace:
    path: /etc/apk/repositories
    regexp: '^#(.*community)$'
    replace: '\1'

- name: Docker, Docker Compose und nftables auf Alpine installieren
  community.general.apk:
    name:
      - docker
      - docker-cli-compose
      - nftables
    state: present

- name: Benötigte Kernel-Module für Docker laden
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - overlay
    - br_netfilter
    - nf_tables

- name: Docker-Dienst in OpenRC aktivieren und starten
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
