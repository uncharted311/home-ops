---
- name: Default-Setup für alle Linux-Hosts
  hosts: linux
  become: true
  gather_facts: false
  roles:
    - bootstrap

- name: OS- & SSH-Hardening sowie Public-Firewall anwenden
  hosts: linux
  become: true
  tasks:
    - name: OS Hardening auf Debian/Ubuntu ausführen
      ansible.builtin.include_role:
        name: devsec.hardening.os_hardening
      when: ansible_facts['os_family'] == "Debian"

    - name: SSH Hardening auf allen Linux-Systemen ausführen
      ansible.builtin.include_role:
        name: devsec.hardening.ssh_hardening

    - name: Dynamische Management-Firewall auf Public-Hosts einrichten
      ansible.builtin.include_role:
        name: public_firewall
      when: "'public' in group_names"
