---
admin_user: "heinrich-adm"
admin_github_keys_url: "https://github.com/uncharted311.keys"

timezone: "Europe/Berlin"

# renovate: datasource=github-releases depName=fastfetch-cli/fastfetch
fastfetch_version: "2.71.0"

# renovate: datasource=docker depName=ghcr.io/moghtech/komodo-core
komodo_version: "2.3.4"

# renovate: datasource=github-releases depName=cloudflare/cloudflared
cloudflared_version: "2026.11.2"

# devsec.hardening SSH-Vorgaben
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_allow_agent_forwarding: "no"
ssh_allow_tcp_forwarding: "local"
sftp_enabled: true

custom_sysctl_settings:
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  kernel.kptr_restrict: 2
