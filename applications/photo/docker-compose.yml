services:
  # Nginx Reverse Proxy - https://github.com/nginx/nginx
  nginx:
    image: nginx:1.31.8-alpine
    container_name: nginx
    env_file:
      - /opt/docker/secrets.env
      - /opt/docker/.env
    depends_on:
      immich:
        condition: service_healthy
    environment:
      - NGINX_ENVSUBST_FILTERED_VAR_NAMES=SECRET_DOMAIN SECRET_CERT_NAME
      - SECRET_CERT_NAME=${SECRET_CERT_NAME}
    volumes:
      - /opt/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/docker/nginx/templates:/etc/nginx/templates:ro
      - /opt/docker/nginx/includes:/etc/nginx/includes:ro
      - /opt/docker/certbot/certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - immich-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: &default-logging # default logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot - https://github.com/cloudflare/certbot-dns-cloudflare
  certbot:
    image: certbot/dns-cloudflare:v5.10.0
    container_name: certbot
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file:
      - /opt/docker/secrets.env
      - /opt/docker/.env
    environment:
      - SECRET_CERT_NAME=${SECRET_CERT_NAME}
    volumes:
      - /opt/docker/certbot/certs:/etc/letsencrypt
      - /opt/docker/certbot/cloudflare.ini:/cloudflare.ini:ro
      - /opt/docker/certbot/certbot-entrypoint.sh:/entrypoint.sh:ro
    networks:
      - immich-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "openssl x509 -checkend 604800 -noout -in /etc/letsencrypt/live/${SECRET_CERT_NAME}/fullchain.pem || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    logging: *default-logging

  # Immich - https://github.com/immich-app/immich
  immich:
    image: ghcr.io/immich-app/immich-server:v3.4.1
    container_name: immich
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    env_file:
      - /opt/docker/secrets.env
      - /opt/docker/.env
    environment:
      - PUID=3007
      - PGID=3007
      - UMASK=002
    volumes:
      - /mnt/data:/data
      - /etc/localtime:/etc/localtime:ro
    expose:
      - 2283/tcp # Webserver
    networks:
      - immich-internal
    restart: unless-stopped
    healthcheck:
      disable: false
    #healthcheck:
    #  test: ["CMD-SHELL", "openssl x509 -checkend 604800 -noout -in /etc/letsencrypt/live/${SECRET_CERT_NAME}/fullchain.pem || exit 1"]
    #  interval: 30s
    #  timeout: 10s
    #  retries: 10
    logging: *default-logging
    
  # Immich - https://github.com/immich-app/immich
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1
    container_name: immich-machine-learning
    env_file:
      - /opt/docker/secrets.env
      - /opt/docker/.env
    environment:
      - MACHINE_LEARNING_MODEL_REVISION=v2
      - MACHINE_LEARNING_MODEL_TTL=30
      - MACHINE_LEARNING_WORKERS=1
    volumes:
      - model-cache:/cache
    networks:
      - immich-internal
    restart: unless-stopped
    healthcheck:
      disable: false
    #healthcheck:
    #  test: ["CMD-SHELL", "openssl x509 -checkend 604800 -noout -in /etc/letsencrypt/live/${SECRET_CERT_NAME}/fullchain.pem || exit 1"]
    #  interval: 30s
    #  timeout: 10s
    #  retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.5'

  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    container_name: immich_redis
    env_file:
      - /opt/docker/.env
    networks:
      - immich-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    logging: *default-logging

  # Immich - https://github.com/immich-app/immich
  database:
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    container_name: immich_postgres
    env_file:
      - /opt/docker/secrets.env
      - /opt/docker/.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    shm_size: 128mb
    volumes:
      - immich-db-data:/var/lib/postgresql/data
    networks:
      - immich-internal
    restart: unless-stopped
    healthcheck:
      disable: false
    #healthcheck:
    #  test: ["CMD-SHELL", "openssl x509 -checkend 604800 -noout -in /etc/letsencrypt/live/${SECRET_CERT_NAME}/fullchain.pem || exit 1"]
    #  interval: 30s
    #  timeout: 10s
    #  retries: 10
    logging: *default-logging

volumes:
  model-cache:
  immich-db-data:

networks:
  immich-internal:
    driver: bridge