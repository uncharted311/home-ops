services:
   honeypot64:
    image: ghcr.io/ipv64net/node64:1.1.0
    container_name: honeypot64
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
      - /opt/docker/secrets.env
    read_only: true
    cap_add:
      - NET_ADMIN
    environment:
      NODE64_MODE: honeypot
      NODE64_FIREWALL: nftables
      NODE64_HONEYPOT_PROFILE: standard   # oder: minimal, full
      NODE64_IPV64_KEY: ${NODE64_IPV64_KEY}    # optional: Meldung an ipv64 einschalten
      NODE64_HONEYPOT_SERVICES: ssh:2222,telnet:23,http:80,http:443,http:8080,smtp:587,smtp:25,rdp:3389,vnc:5900,mikrotik-api:8728,postgres:5432
    volumes:
      - honeypot64:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  honeypot64: